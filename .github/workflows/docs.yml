name: docs-build-deploy

on:
  workflow_dispatch:
  push:
    branches: ["5.2"]
  pull_request:
    branches: ["*"]

jobs:
  build-docs:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      # rendered example images are keyed on the examples, the render script and
      # nodebpy's source; render.py re-renders only those whose inputs changed
      - name: Cache example renders
        uses: actions/cache@v4
        with:
          path: docs/examples/images
          key: example-renders-${{ hashFiles('docs/examples/code/*.py', 'docs/examples/render.py', 'src/nodebpy/**/*.py') }}
          restore-keys: example-renders-

      - name: Build Docs
        run: |
          uv sync --all-extras
          uv pip install -e .
          cd docs
          uv run quartodoc build
          uv run quartodoc interlinks

      - name: Quarto Render
        run: |
          uv run quarto render docs

      # The 5.2 branch only builds the docs as a check: gh-pages is published
      # from main's tags, so a 5.2 bug-fix release doesn't replace the current docs.
