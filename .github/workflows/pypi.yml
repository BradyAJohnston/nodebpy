on:
    push:
        tags:
            - 'v*'

jobs:
    pypi-publish:
      name: Upload release to PyPI
      runs-on: ubuntu-latest
      environment:
        name: pypi
        url: https://pypi.org/p/nodebpy
      permissions:
        id-token: write
        contents: write
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        
        - name: Install uv
          uses: astral-sh/setup-uv@v4
          with:
            version: "latest"
        
        - name: build
          run: |
            uv build

        - name: Create GH Release
          run: |
            # Releases from the 5.2 branch are bug fixes for an older Blender, so
            # they don't take "Latest" from the current release.
            # Notes start from the previous tag on this branch, not the newest 530 tag.
            prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^")
            gh release create ${{ github.ref_name }} --generate-notes --notes-start-tag "$prev" --latest=false dist/*
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Publish to PyPI  
          uses: pypa/gh-action-pypi-publish@release/v1