name: Run Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install
        run: |
          uv sync --all-extras

      - name: Run tests
        run: |
          uv run pytest -n auto -vv --cov=nodebpy --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'macos-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: coverage.xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'macos-latest'
        uses: codecov/codecov-action@v3

  # The node classes are generated from Blender 5.3; everything 5.3 did not
  # add must keep working on 5.2. Tests using 5.3's additions skip themselves.
  test-blender-5-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install, with bpy 5.2
        run: |
          uv sync --all-extras
          uv pip install "bpy==5.2.*"

      - name: Run tests
        run: |
          uv run --no-sync pytest -n auto
