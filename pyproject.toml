[project]
name = "nodebpy"
version = "520.21.0"
description = "Build nodes trees in Blender more elegantly with code"
readme = "README.md"
authors = [
    { name = "Brady Johnston", email = "brady.johnston@me.com" }
]
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }

[project.scripts]
nodebpy = "nodebpy:main"

[project.optional-dependencies]
networkx = [
    "networkx>=3.6.1",
]
plot = [
    "matplotlib>=3.8",
]
bpy = [
    "bpy==5.2.*",
]
# Used by `to_python(format=True)` to tidy generated source via `ruff format`.
format = [
    "ruff>=0.14.11",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "networkx>=3.6.1",
    "fake-bpy-module>=20260501",
    "jsondiff>=2.2.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "quarto-cli>=1.9",
    "quartodoc>=0.11.1",
    "tree-clipper>=0.1.6",
    "ruff>=0.14.11",
    "syrupy>=5.0.0",
    "pytest-xdist>=3.8.0",
    "griffe<2.0.0",
    "ty==0.0.74",
    "types-networkx>=3.6.1.20260728",
    "matplotlib>=3.11.2",
]

# The bpy stubs mark most collections/pointers as `| None` and cannot type
# dynamic attributes (e.g. `socket.default_value`), which test code exercises
# constantly under a real Blender runtime. Relax only those rules for tests;
# src/ passes `ty check` with no per-directory relaxation.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"

[tool.ruff.lint]
ignore = ["SIM117", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"tests/test_codegen.py" = ["S102"]
"tests/test_assets.py" = ["S102"]
"tests/test_layout_snapshot.py" = ["S102"]
